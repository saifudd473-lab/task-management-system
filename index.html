<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Task Management System</title>

<style>

html,body{

button,input,select,textarea{

th,td{

/* ================= LOADING ================= */

  animation:spin .7s linear infinite;

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* ================= MOBILE ================= */

@media(max-width:800px){

  .header{

    min-height:60px;

  .header-title{
    font-size:17px;

    font-size:12px;

}

  .login-box{
    padding:23px;

  .cards{
    grid-template-columns:1fr 1fr;

    padding:14px;
  }

  .card-value{
    font-size:22px;
  }

  .user-info span{
    display:none;
  }
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<section id="loginPage" class="login">

  <div class="login-box">

    <h1>Task Management</h1>

    <p>Registered email se login karein</p>

    <input

</section>


<!-- ================= APP ================= -->

<section id="app" class="hidden">

  <header class="header">

    <div class="header-title">
      Task Management System
    </div>

    <div class="user-info">

      <span id="userName"></span>

<script>

/* =========================================================
   APPS SCRIPT BACKEND
========================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbwoCH_Hxuryc-_5XgkFkF81kIAji9OqMS2nPxRN7cq2gixVR72B8cCrLXwtzjIFeGDA/exec";


/* =========================================================
   GLOBAL
========================================================= */

let currentUser = null;


/* =========================================================
   FAST API REQUEST
========================================================= */

async function api(action, data = {}){

  const controller = new AbortController();

  const timeout = setTimeout(() => {
    controller.abort();
  }, 15000);

  try{

    const response = await fetch(API_URL, {

      method:"POST",

      headers:{
        "Content-Type":"text/plain;charset=utf-8"
      },

      body:JSON.stringify({
        action:action,
        ...data
      }),

      signal:controller.signal

    });

    clearTimeout(timeout);

    if(!response.ok){
      throw new Error("HTTP " + response.status);
    }

    const text = await response.text();

    if(!text){
      throw new Error("Empty backend response");
    }

    try{
      return JSON.parse(text);
    }
    catch(e){
      console.error("Backend returned:",text);
      throw new Error("Invalid backend response");
    }

  }
  catch(error){

    clearTimeout(timeout);

    if(error.name === "AbortError"){
      throw new Error("Backend timeout");
    }

    throw error;
  }

}


/* =========================================================
   LOGIN
========================================================= */

async function login(){

  const email =
    document.getElementById("email").value
    .trim()
    .toLowerCase();

  const passwordElement =
    document.getElementById("password");

  const password =
    passwordElement
      ? passwordElement.value
      : "";

  const btn =
    document.getElementById("loginBtn");

  const status =
    document.getElementById("loginStatus");


  if(!email){

    status.innerText =
      "Email enter karo";

    return;
  }


  btn.disabled = true;

  btn.innerText = "Checking...";

  status.innerText =
    "Connecting to server...";


  try{

    const result =
      await api("login",{
        email:email,
        password:password
      });


    console.log("LOGIN RESPONSE:",result);


    /* Supreme password required */

    if(result.requirePassword){

      document
        .getElementById("passwordArea")
        .classList
        .remove("hidden");

      status.innerText =
        "Password enter karo";

      document
        .getElementById("password")
        .focus();

      return;
    }


    /* Login failed */

    if(!result.success){

      status.innerText =
        result.message ||
        "Login failed";

      return;
    }


    /* Login success */

    currentUser = result;


    localStorage.setItem(
      "loggedUser",
      JSON.stringify(result)
    );


    /* Dashboard immediately */

    openDashboard(result);

  }
  catch(error){

    console.error(error);

    status.innerText =
      "Server error: " +
      error.message;

  }
  finally{

    btn.disabled = false;

    btn.innerText = "Login";

  }

}


/* =========================================================
   OPEN DASHBOARD
========================================================= */

function openDashboard(user){

  document
    .getElementById("loginPage")
    .classList
    .add("hidden");

  document
    .getElementById("app")
    .classList
    .remove("hidden");


  document
    .getElementById("userName")
    .innerText =
      user.name ||
      user.email ||
      "";


  document
    .getElementById("userRole")
    .innerText =
      user.role ||
      "";


  showPage("dashboard");

  /*
     Dashboard UI immediately opens.
     Backend data can be loaded separately.
  */

  loadDashboardFast();

}


/* =========================================================
   SESSION CHECK
========================================================= */

function checkSession(){

  try{

    const saved =
      localStorage.getItem("loggedUser");

    if(!saved){
      return;
    }

    const user =
      JSON.parse(saved);

    if(!user || !user.email){
      return;
    }

    currentUser = user;

    openDashboard(user);

  }
  catch(error){

    localStorage.removeItem("loggedUser");

  }

}


/* =========================================================
   PAGE SWITCH
========================================================= */

function showPage(page){

  const pages = [
    "dashboard",
    "tasks",
    "assign",
    "reports"
  ];


  pages.forEach(p => {

    const el =
      document.getElementById(
        p + "Page"
      );

    if(el){

      if(p === page)
        el.classList.remove("hidden");
      else
        el.classList.add("hidden");

    }

  });


  document
    .querySelectorAll(".nav button")
    .forEach(btn =>
      btn.classList.remove("active")
    );


  const nav =
    document.getElementById(
      "nav" +
      page.charAt(0).toUpperCase() +
      page.slice(1)
    );

  if(nav){
    nav.classList.add("active");
  }


  if(page === "dashboard"){
    loadDashboardFast();
  }

}


/* =========================================================
   FAST DASHBOARD
========================================================= */

async function loadDashboardFast(){

  /*
    Dashboard first render hota hai.
    Backend slow ho to login/dashboard block nahi hota.
  */

  const box =
    document.getElementById(
      "dashboardMessage"
    );

  if(!box) return;


  box.innerHTML = `
    <div class="loader">
      Dashboard ready
    </div>
  `;


  /*
    Agar tumhare existing Code.gs me
    getDashboard / dashboard / getTasks
    action ka naam different hai,
    yahan tumhara existing action connect karna hoga.
  */

  try{

    const result =
      await api("getDashboard",{
        email:
          currentUser
            ? currentUser.email
            : ""
      });


    if(!result || !result.success){

      box.innerHTML = `
        <div style="padding:20px;color:#777">
          Dashboard loaded.
        </div>
      `;

      return;
    }


    updateDashboard(result);


  }
  catch(error){

    console.warn(
      "Dashboard API:",
      error.message
    );

    /*
      Login ko fail nahi karte.
      Dashboard already open hai.
    */

    box.innerHTML = `
      <div style="padding:20px;color:#777">
        Dashboard opened. Data refresh pending.
      </div>
    `;

  }

}


/* =========================================================
   UPDATE DASHBOARD
========================================================= */

function updateDashboard(data){

  setValue(
    "totalTasks",
    data.total ||
    data.totalTasks ||
    0
  );

  setValue(
    "pendingTasks",
    data.pending ||
    data.pendingTasks ||
    0
  );

  setValue(
    "progressTasks",
    data.inProgress ||
    data.progress ||
    data.inProgressTasks ||
    0
  );

  setValue(
    "completedTasks",
    data.completed ||
    data.completedTasks ||
    0
  );

  setValue(
    "blockedTasks",
    data.blocked ||
    data.blockedTasks ||
    0
  );

  setValue(
    "delayedTasks",
    data.delayed ||
    data.delayedTasks ||
    0
  );

  setValue(
    "extendedTasks",
    data.extended ||
    data.extendedTasks ||
    0
  );


  const box =
    document.getElementById(
      "dashboardMessage"
    );

  if(box){

    box.innerHTML = `
      <div style="padding:20px">
        Dashboard data updated successfully.
      </div>
    `;

  }

}


function setValue(id,value){

  const el =
    document.getElementById(id);

  if(el){
    el.innerText = value;
  }

}


/* =========================================================
   ASSIGN TASK
========================================================= */

async function assignTask(){

  const taskName =
    document.getElementById(
      "taskName"
    ).value.trim();

  const employee =
    document.getElementById(
      "employee"
    ).value.trim();

  const priority =
    document.getElementById(
      "priority"
    ).value;

  const dueDate =
    document.getElementById(
      "dueDate"
    ).value;

  const remarks =
    document.getElementById(
      "remarks"
    ).value.trim();


  if(!taskName){
    alert("Task Name enter karo");
    return;
  }

  if(!employee){
    alert("Employee enter karo");
    return;
  }

  if(!dueDate){
    alert("Due Date select karo");
    return;
  }


  try{

    const result =
      await api("assignTask",{

        taskName:taskName,

        employee:employee,

        doerEmail:employee,

        priority:priority,

        dueDate:dueDate,

        remarks:remarks,

        assignedBy:
          currentUser
            ? currentUser.email
            : ""

      });


    if(!result.success){

      alert(
        result.message ||
        "Task assign failed"
      );

      return;
    }


    alert("Task successfully assigned");


    document
      .getElementById("taskName")
      .value = "";

    document
      .getElementById("employee")
      .value = "";

    document
      .getElementById("dueDate")
      .value = "";

    document
      .getElementById("remarks")
      .value = "";


    showPage("dashboard");

  }
  catch(error){

    alert(
      "Server error: " +
      error.message
    );

  }

}


/* =========================================================
   REPORTS
========================================================= */

async function loadReports(){

  const box =
    document.getElementById(
      "reportsResult"
    );

  box.innerHTML = `
    <div class="loader">
      Loading reports...
    </div>
  `;


  try{

    const result =
      await api("getReports",{

        email:
          currentUser
            ? currentUser.email
            : ""

      });


    if(!result.success){

      box.innerHTML =
        `<div class="form-box">
          ${result.message || "Report unavailable"}
        </div>`;

      return;
    }


    box.innerHTML =
      `<div class="form-box">
        Reports loaded successfully.
      </div>`;

  }
  catch(error){

    box.innerHTML =
      `<div class="form-box">
        Report loading error: ${error.message}
      </div>`;

  }

}


/* =========================================================
   LOGOUT
========================================================= */

function logout(){

  localStorage.removeItem(
    "loggedUser"
  );

  currentUser = null;

  location.reload();

}


/* =========================================================
   PASSWORD BOX
========================================================= */

function showPasswordBox(){

  document
    .getElementById("passwordArea")
    .classList
    .remove("hidden");

}


/* =========================================================
   ENTER KEY LOGIN
========================================================= */

document
  .getElementById("email")
  .addEventListener(
    "keydown",
    function(e){

      if(e.key === "Enter"){
        login();
      }

    }
  );


document
  .getElementById("password")
  .addEventListener(
    "keydown",
    function(e){

      if(e.key === "Enter"){
        login();
      }

    }
  );


/* =========================================================
   START
========================================================= */

checkSession();

</script>

</body>
</html>
